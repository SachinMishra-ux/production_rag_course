name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Create .nojekyll
        run: touch frontend/dist/.nojekyll

      - name: Setup gh-pages Vercel compatibility
        run: |
          mkdir -p frontend/dist/frontend
          cp -r frontend/dist/assets frontend/dist/frontend/ 2>/dev/null || true
          cp frontend/dist/index.html frontend/dist/frontend/ 2>/dev/null || true
          echo '{"framework": null, "outputDirectory": "."}' > frontend/dist/frontend/vercel.json
          echo '{"framework": null, "outputDirectory": "."}' > frontend/dist/vercel.json

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
